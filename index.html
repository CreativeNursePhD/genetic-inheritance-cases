<html lang="en">
<head>

<title>Genetics in Practice: Four Clinical Cases</title>

<style>
:root{
  --navy:#0b2a5b; --blue:#0033a0; --blue-dark:#00267a; --blue-tint:#e8eef9; --blue-line:#b9c8ea;
  --ink:#1c2533; --muted:#4a5568; --line:#d5dbe5; --bg:#f6f8fb; --card:#ffffff;
  --ok:#1a6b3a; --ok-bg:#e6f4ea; --no:#a4262c; --no-bg:#fdecee; --note-bg:#fff6e0; --note-line:#c98a00;
  --var-bg:#fde7dc; --var-ink:#7a2500; --var-line:#c2410c;
  --typ-bg:#e3ebfb; --typ-ink:#0b2a5b; --typ-line:#0033a0;
  --y-bg:#ece9f5; --y-ink:#3d2f6b; --y-line:#5b4b9a;
  --radius:10px; --focus:#ffbf47;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:100%}
body{margin:0;font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;font-size:1.0625rem}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:0;background:#fff;color:var(--blue);padding:.6rem 1rem;z-index:100;font-weight:700}
.skip:focus{left:.5rem;top:.5rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 5px var(--navy)}
a{color:var(--blue)}
h1,h2,h3{line-height:1.25;color:var(--navy)}
h1{font-size:1.75rem;margin:.2rem 0 .8rem}
h2{font-size:1.3rem;margin:0 0 .6rem}
h3{font-size:1.1rem;margin:1rem 0 .4rem}
p{margin:.5rem 0}
.topbar{background:var(--navy);color:#fff}
.topbar-inner{max-width:60rem;margin:0 auto;padding:.7rem 1rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column}
.brand .course{font-size:.85rem;opacity:.9}
.brand .name{font-weight:700;font-size:1.1rem}
.top-actions{display:flex;gap:.5rem;flex-wrap:wrap}
.topbar .btn-ghost{background:transparent;color:#fff;border:2px solid #fff}
.topbar .btn-ghost:hover{background:rgba(255,255,255,.12)}
.topbar a{color:#fff}
nav.progress{background:#fff;border-bottom:1px solid var(--line)}
nav.progress ol{list-style:none;margin:0 auto;padding:.5rem 1rem;max-width:60rem;display:flex;flex-wrap:wrap;gap:.35rem}
nav.progress button{min-height:44px;padding:.35rem .7rem;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:.92rem;cursor:pointer;display:flex;align-items:center;gap:.35rem}
nav.progress button[aria-current="step"]{border-color:var(--blue);background:var(--blue-tint);font-weight:700}
nav.progress button[aria-disabled="true"]{color:#5f6b7a;background:#f1f3f6;cursor:not-allowed}
nav.progress .st{font-size:.8rem;font-weight:700}
nav.progress .st.done{color:var(--ok)}
main{max-width:60rem;margin:0 auto;padding:1.2rem 1rem 3rem}
main:focus{outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.2rem 1.25rem;margin:0 0 1rem}
.card.step{border-left:5px solid var(--blue)}
.card.step.done{border-left-color:var(--ok)}
.step-label{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--blue);margin:0}
.step.done .step-label{color:var(--ok)}
.meta{display:flex;flex-wrap:wrap;gap:.5rem;margin:.3rem 0 .8rem}
.pill{display:inline-block;background:var(--blue-tint);color:var(--navy);border-radius:999px;padding:.15rem .7rem;font-size:.88rem;font-weight:600}
.callout{background:var(--blue-tint);border:1px solid var(--blue-line);border-radius:var(--radius);padding:.8rem 1rem;margin:.8rem 0}
.callout.note{background:var(--note-bg);border-color:var(--note-line)}
.quote{border-left:4px solid var(--blue);padding:.4rem .9rem;margin:.8rem 0;background:#f8faff;font-style:italic}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:44px;min-width:44px;padding:.55rem 1.1rem;border-radius:8px;border:2px solid var(--blue);background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--blue-dark);border-color:var(--blue-dark)}
.btn-secondary{background:#fff;color:var(--blue)}
.btn-secondary:hover{background:var(--blue-tint);color:var(--blue-dark)}
.btn-danger{background:#fff;color:var(--no);border-color:var(--no)}
.btn-danger:hover{background:var(--no-bg)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.8rem}
.navrow{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.6rem;margin-top:1.2rem}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-weight:700;font-size:1.05rem;color:var(--navy);padding:0;margin-bottom:.3rem}
.instr{color:var(--muted);margin:.2rem 0 .6rem;font-size:.98rem}
.opt{display:flex;gap:.7rem;align-items:flex-start;border:2px solid var(--line);border-radius:8px;padding:.65rem .8rem;margin:.45rem 0;cursor:pointer;min-height:44px;background:#fff}
.opt:hover{border-color:var(--blue-line)}
.opt input{width:1.25rem;height:1.25rem;margin-top:.15rem;flex:0 0 auto;accent-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:#f6f9ff}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt-tag{font-weight:700;margin-left:.3rem}
.fb{margin-top:.8rem;border-radius:8px}
.fb:empty{display:none}
.fb .box{padding:.7rem .9rem;border-radius:8px;border:2px solid}
.fb .ok{border-color:var(--ok);background:var(--ok-bg)}
.fb .no{border-color:var(--no);background:var(--no-bg)}
.fb .info{border-color:var(--blue-line);background:var(--blue-tint)}
.fb strong.v{display:block;margin-bottom:.2rem}
.fb .ok strong.v{color:var(--ok)}
.fb .no strong.v{color:var(--no)}
.chip{display:inline-block;padding:0 .35rem;border-radius:5px;border:1.5px solid;font-weight:700;line-height:1.5}
.chip.t{background:var(--typ-bg);color:var(--typ-ink);border-color:var(--typ-line)}
.chip.v{background:var(--var-bg);color:var(--var-ink);border-color:var(--var-line);border-style:dashed}
.chip.y{background:var(--y-bg);color:var(--y-ink);border-color:var(--y-line);border-style:dotted}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1rem;font-size:.95rem;margin:.4rem 0}
.notation{margin:.6rem 0;padding:0;list-style:none}
.notation li{margin:.25rem 0}
/* Punnett square */
.psq-wrap{overflow-x:auto}
table.psq{border-collapse:separate;border-spacing:6px;margin:.4rem 0}
table.psq th, table.psq td{padding:0;text-align:center;vertical-align:middle}
table.psq .corner{font-size:.8rem;color:var(--muted);line-height:1.25;width:5.5rem;text-align:left;padding:.2rem}
.slot{width:5.6rem;height:3.4rem;min-width:44px;min-height:44px;border:2px dashed #8492a6;border-radius:8px;background:#fff;font:inherit;font-weight:700;font-size:1.15rem;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative}
.slot.hdr{background:#f9fafc}
.slot.filled{border-style:solid;border-color:#8492a6}
.slot.active{border-color:var(--blue);border-style:solid;box-shadow:0 0 0 3px var(--blue-tint)}
.slot.mark-no{border-color:var(--no);border-style:solid;background:var(--no-bg)}
.slot.mark-ok{border-color:var(--ok);border-style:solid}
.slot .mk{font-size:.72rem;font-weight:700;line-height:1}
.slot.mark-no .mk{color:var(--no)}
.slot.mark-ok .mk{color:var(--ok)}
.slot .ph{font-size:.8rem;font-weight:600;color:#5f6b7a}
.picker{border:2px solid var(--blue);border-radius:var(--radius);background:#f6f9ff;padding:.7rem .9rem;margin:.6rem 0}
.picker p{margin:.1rem 0 .5rem;font-weight:600}
.picker .opts{display:flex;flex-wrap:wrap;gap:.5rem}
.picker .pbtn{min-width:64px;min-height:48px;font:inherit;font-size:1.1rem;font-weight:700;border-radius:8px;border:2px solid var(--blue);background:#fff;color:var(--ink);cursor:pointer;padding:.3rem .8rem}
.picker .pbtn:hover{background:var(--blue-tint)}
.picker .pbtn.cur{background:var(--blue-tint)}
.picker .small{font-size:.95rem;font-weight:600;min-height:44px}
.solution{margin-top:.6rem}
/* probability */
.prob-row{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:.55rem .8rem;margin:.45rem 0;background:#fff}
.prob-row label{flex:1 1 16rem;font-weight:600}
.prob-row select{min-height:44px;font:inherit;padding:.3rem .5rem;border-radius:6px;border:2px solid #8492a6;background:#fff;min-width:7rem}
.prob-row .mk{font-weight:700;font-size:.9rem}
.prob-row.mark-no{border-color:var(--no);background:var(--no-bg)}
.prob-row.mark-ok{border-color:var(--ok)}
.prob-row.mark-no .mk{color:var(--no)}
.prob-row.mark-ok .mk{color:var(--ok)}
/* reflection */
textarea{width:100%;min-height:9rem;font:inherit;padding:.6rem .7rem;border-radius:8px;border:2px solid #8492a6;resize:vertical}
.wc{font-size:.92rem;color:var(--muted);margin-top:.3rem}
.wc.ok{color:var(--ok);font-weight:600}
.prompt-list{margin:.4rem 0 .6rem 1.1rem;padding:0}
.prompt-list li{margin:.2rem 0}
label.lbl{display:block;font-weight:700;margin:.6rem 0 .3rem}
input[type=text]{font:inherit;min-height:44px;padding:.4rem .6rem;border-radius:8px;border:2px solid #8492a6;width:100%;max-width:24rem}
/* tables */
table.data{border-collapse:collapse;width:100%;margin:.5rem 0;font-size:.97rem}
table.data th, table.data td{border:1px solid var(--line);padding:.45rem .55rem;text-align:left;vertical-align:top}
table.data th{background:var(--blue-tint);color:var(--navy)}
.score-big{font-size:2rem;font-weight:700;color:var(--navy)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.8rem}
details{border:1px solid var(--line);border-radius:8px;padding:.5rem .8rem;margin:.45rem 0;background:#fff}
details summary{cursor:pointer;font-weight:700;color:var(--navy);min-height:32px;display:list-item}
dl.terms dt{font-weight:700;margin-top:.5rem;color:var(--navy)}
dl.terms dd{margin:.1rem 0 0 0}
.mini-controls{display:flex;flex-wrap:wrap;gap:1rem;margin:.5rem 0}
.mini-controls label{font-weight:600;display:flex;flex-direction:column;gap:.2rem}
.mini-controls select{min-height:44px;font:inherit;border-radius:6px;border:2px solid #8492a6;padding:.3rem .5rem}
.mini-sq td,.mini-sq th{border:1px solid var(--line);width:4.2rem;height:2.8rem;text-align:center;font-weight:700}
.mini-sq{border-collapse:collapse;margin:.5rem 0}
.mini-sq th{background:var(--blue-tint)}
dialog{border:0;border-radius:var(--radius);padding:0;max-width:44rem;width:calc(100% - 1.5rem);max-height:calc(100% - 1.5rem)}
dialog::backdrop{background:rgba(11,42,91,.55)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.8rem 1rem;background:var(--navy);color:#fff;position:sticky;top:0;z-index:1}
.dlg-head h2{color:#fff;margin:0}
.dlg-head .btn{background:#fff;color:var(--navy);border-color:#fff}
.dlg-body{padding:1rem}
.sources li{margin:.3rem 0}
.confirm{margin-top:.6rem}
#record{display:none}

.case-photo{margin:0 0 1rem}
.case-photo img{display:block;width:100%;height:auto;max-height:320px;object-fit:cover;object-position:center 30%;border-radius:8px}
.clearfix::after{content:"";display:table;clear:both}
.clearfix .callout,.clearfix .quote{display:flow-root}
@media (max-width:520px){
  body{font-size:1rem}
  h1{font-size:1.45rem}
  .card{padding:1rem .85rem}
  .slot{width:4.3rem;height:3.1rem;font-size:1rem}
  table.psq{border-spacing:4px}
  table.psq .corner{width:4rem;font-size:.72rem}
  nav.progress button{font-size:.85rem;padding:.3rem .55rem}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media print{
  body{background:#fff;font-size:11pt}
  body > *:not(#record){display:none!important}
  #record{display:block!important;color:#000}
  #record h1{font-size:16pt;color:#000}
  #record h2{font-size:13pt;color:#000;margin-top:14pt;page-break-after:avoid}
  #record h3{font-size:11.5pt;color:#000;page-break-after:avoid}
  #record table{page-break-inside:avoid}
  #record .refl-text{white-space:pre-wrap;border:1px solid #999;padding:6pt;page-break-inside:avoid}
  #record table.data th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #record .mini-sq th{background:#eee!important}
}
</style>

<script>
(function(){
"use strict";

/* ---------- Storage (this device and browser only) ---------- */
var KEY = "genetics-in-practice-v1";
function blankState(){ return {v:1, name:"", screen:"welcome", items:{}, squares:{}, refl:{}, startedAt:new Date().toISOString()}; }
var state = blankState();
var storageOK = true;
try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); if (p && p.v === 1) state = p; } }
catch(e){ storageOK = false; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ storageOK = false; } }

/* ---------- Helpers ---------- */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function $(sel, root){ return (root || document).querySelector(sel); }
function $all(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function announce(msg){ var l = $("#live"); l.textContent = ""; setTimeout(function(){ l.textContent = msg; }, 60); }
function reduceMotion(){ return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
function words(t){ var m = String(t || "").trim().match(/[A-Za-z0-9À-ɏ'’-]+/g); return m ? m.length : 0; }
function item(id){ if (!state.items[id]) state.items[id] = {done:false, attempts:0, firstCorrect:null, answer:null, firstAnswer:null, revealed:false, fb:null}; return state.items[id]; }
function refl(id){ if (!state.refl[id]) state.refl[id] = {text:"", submitted:false, pasted:false, pasteChars:0}; return state.refl[id]; }

/* Allele display. Speech labels keep capital and lowercase letters distinguishable for screen readers. */
var SPEAK = {F:"capital F", f:"lowercase f", H:"capital H", h:"lowercase h", XH:"X capital H", Xh:"X lowercase h", Y:"Y", HbA:"H b A", HbS:"H b S", A:"capital A", a:"lowercase a"};
function alleleHTML(code){
  if (code === "XH") return 'X<sup>H</sup>';
  if (code === "Xh") return 'X<sup>h</sup>';
  return esc(code);
}
function splitGeno(g, sys){
  if (sys === "x") return g.match(/XH|Xh|Y/g) || [];
  if (sys === "hb") return g.replace(/^Hb/,"").split("").map(function(c){ return "Hb"+c; });
  return g.split("");
}
function genoHTML(g, sys){
  if (sys === "hb") return esc(g);
  return splitGeno(g, sys).map(alleleHTML).join("");
}
function genoSpeak(g, sys){ return splitGeno(g, sys).map(function(a){ return SPEAK[a] || a; }).join(" "); }
function combine(a, b, sys){
  if (sys === "x"){ var o = ["XH","Xh","Y"]; return [a,b].sort(function(p,q){ return o.indexOf(p)-o.indexOf(q); }).join(""); }
  if (sys === "hb"){ return "Hb" + [a,b].map(function(x){ return x.replace("Hb",""); }).sort().join(""); }
  var up = function(x){ return x === x.toUpperCase() ? 0 : 1; };
  return [a,b].sort(function(p,q){ return up(p)-up(q); }).join("");
}
function chip(code, c){
  var cls = (c.variants.indexOf(code) > -1) ? "v" : (code === "Y" ? "y" : "t");
  return '<span class="chip '+cls+'">'+alleleHTML(code)+'</span>';
}

/* ---------- Content ---------- */
var COMP = {
  "1.2a":"Apply knowledge from nursing science and other sciences by interpreting inheritance patterns and relating genetic findings to healthcare situations.",
  "1.3a":"Demonstrate clinical reasoning through probability calculations, interpretation, and selection of appropriate responses.",
  "1.3b":"Integrate professional knowledge, genetic information, evidence, and patient circumstances to inform clinical judgment.",
  "1.3c":"Use genetics and healthcare knowledge to support an appropriate clinical judgment or professional action."
};
var PCT = [0,25,50,75,100];
var XH = 'X<sup>H</sup><span class="sr-only"> (no variant)</span>';

{ id:"c1", n:1, title:"Case 1: Cystic fibrosis", short:"Cystic fibrosis", pattern:"Autosomal recessive", level:"Guided introduction", mode:"guided", sys:"letter", variants:["f"],
  scenario:
    '<p>Taylor and Jordan are planning to have a child. Carrier screening showed that each of them carries one disease-causing variant in the <em>CFTR</em> gene. When both copies of this gene have disease-causing variants, a person has cystic fibrosis (CF), a condition that mainly affects the lungs and digestive system.</p>'+
    '<p>Neither Taylor nor Jordan has CF. They want to know how likely it is that a child of theirs would have CF, and what their results mean for their family.</p>'+
    '<div class="callout"><strong>Good to know: how common is cystic fibrosis?</strong> Close to 40,000 children and adults in the United States are living with cystic fibrosis, and an estimated 105,000 people have been diagnosed with it across 94 countries. Being a carrier is much more common than having CF: about 1 in 30 people in the United States carries one CF variant.</div>'+
    '<div class="callout"><strong>For this exercise:</strong> both parents are heterozygous carriers. That means each has one functional allele and one disease-associated allele. (An <strong>allele</strong> is one version of a gene. You inherit one allele of each gene from each parent.)'+
    '<ul class="notation"><li><span class="chip t">F</span> = functional allele</li><li><span class="chip v">f</span> = disease-associated allele</li></ul></div>'+
    '<div class="callout note"><strong>Case 1 is guided.</strong> You will see tips along the way, and you can try again as many times as you need.</div>',
  steps:[
    {id:"c1-pattern", type:"mc", label:"Identify the inheritance pattern", comp:["1.2a"],
     q:"Which inheritance pattern does cystic fibrosis follow?", instr:"Choose one. There is one correct answer.",
     options:[
      {t:"Autosomal dominant: a single copy of the variant, from either parent, is enough to cause the condition.", fb:"Taylor and Jordan each carry one variant, but neither has CF. What does that tell you about whether one copy is enough?"},
      {t:"Autosomal recessive: a person needs two copies of the variant, one from each parent, to have the condition.", ok:true},
      {t:"X-linked recessive: the gene is on the X chromosome, so chances depend on which sex chromosomes a child inherits.", fb:"The <em>CFTR</em> gene is on chromosome 7, a numbered chromosome (an autosome), not the X chromosome."},
      {t:"There is not enough information in the scenario to tell which pattern cystic fibrosis follows.", fb:"There is enough here. Think about the fact that both parents carry a variant and neither has CF."}],
     explain:"Cystic fibrosis is autosomal recessive. A person has CF only when both copies of <em>CFTR</em> have disease-causing variants. People with one variant, like Taylor and Jordan, are carriers and usually have no symptoms."},
    {id:"c1-geno", type:"mc", label:"Identify the parents' genotypes", comp:["1.2a"],
     q:"Using F and f, what are Taylor's and Jordan's genotypes?", instr:"A <strong>genotype</strong> is the pair of alleles a person has. The screening results tell you each parent's genotype, so there is one correct pair to find.",
     options:[
      {t:"Taylor FF, Jordan FF", fb:"FF would mean no disease-associated allele at all. Screening found one variant in each of them."},
      {t:"Taylor ff, Jordan ff", fb:"ff means two disease-associated alleles, which would mean having CF. Neither parent has CF."},
      {t:"Taylor Ff, Jordan FF", fb:"Check again: screening found that both partners are carriers, not just one."},
      {t:"Taylor Ff, Jordan Ff", ok:true}],
     explain:"Both are <strong>Ff</strong>, which is called <strong>heterozygous</strong> (two different alleles). FF or ff would be <strong>homozygous</strong> (two of the same allele). Their <strong>phenotype</strong>, the trait you can observe, is &ldquo;no CF.&rdquo;"},
    {id:"c1-square", type:"square", label:"Build the Punnett square", comp:["1.2a","1.3a"],
     topName:"Taylor", sideName:"Jordan", top:["F","f"], side:["F","f"], pool:["F","f"], genos:["FF","Ff","ff"],
     instr:"<ol class=\"prompt-list\"><li>Put <strong>Taylor's</strong> two alleles in the spots across the top.</li><li>Put <strong>Jordan's</strong> two alleles in the spots down the side.</li><li>Fill in each of the four boxes with the genotype a child would get.</li></ol><p><strong>How to enter:</strong> select a spot, then choose from the options that appear below the square.</p>",
     tip:"<strong>Tip:</strong> each box gets one allele from the top of its column and one allele from the start of its row.",
     explain:"The four boxes are FF, Ff, Ff, and ff. Each box stands for one equally likely combination of one allele from each parent."},
    {id:"c1-prob", type:"prob", label:"Calculate the probabilities", comp:["1.3a"],
     q:"For each pregnancy, what is the chance of each outcome?", instr:"Use your completed square. Each of the four boxes is 1 of 4 equally likely outcomes, or 25%.",
     rows:[{t:"A child with cystic fibrosis (ff)", a:25},{t:"A child who is a carrier but does not have CF (Ff)", a:50},{t:"A child with neither familial variant (FF)", a:25}],
     explain:"One of four boxes is ff (25%), two are Ff (50%), and one is FF (25%). These chances apply <strong>separately to each pregnancy</strong>, under the assumptions of this exercise. Earlier children do not change the chances for the next one."},
    {id:"c1-q4", type:"mc", label:"Apply it: answer the couple's question", comp:["1.2a","1.3a"],
     pre:'<div class="quote">&ldquo;We have a one-in-four chance of having a child with cystic fibrosis. Does that mean if we have four children, one will definitely have it?&rdquo;</div>',
     q:"Which response is most accurate and helpful?", instr:"Choose one. There is one best answer.",
     options:[
      {t:"&ldquo;Not necessarily. The 1 in 4 chance applies to each pregnancy on its own, so none, one, or several could have CF.&rdquo;", ok:true},
      {t:"&ldquo;Yes. One in four means that if you have four children, you should expect one of them to have CF.&rdquo;", fb:"This is a very common misunderstanding. The 1 in 4 chance does not spread out across a family. Think about what happens with each pregnancy on its own."},
      {t:"&ldquo;No. Once you have had one child with CF, the chance for each of your later children becomes noticeably lower.&rdquo;", fb:"Earlier pregnancies do not change the chances for later ones. Is the chance any different for the second pregnancy than the first?"},
      {t:"&ldquo;That is a good question for your doctor or a genetics specialist. I am not able to discuss genetic risk.&rdquo;", fb:"Referral matters, but any health professional can explain a probability accurately. Look for a response that answers their question within your role."}],
     explain:"Each pregnancy has the same 25% chance, no matter what happened before. Explaining this clearly helps the couple avoid both false reassurance and false alarm."},
    {id:"c1-q5", type:"ms", label:"Professional reasoning: next steps", comp:["1.3b","1.3c"],
     q:"What additional information or resources might help Taylor and Jordan understand their options and make informed decisions?", instr:"Select <strong>all</strong> that apply. More than one answer is correct.",
     options:[
      {t:"A referral to a genetic counselor or another genetics professional", ok:true},
      {t:"Advice that, given their results, they should consider not having biological children", fb:"This is directive. It takes the decision away from the couple."},
      {t:"Balanced information about reproductive and testing options, without steering them", ok:true},
      {t:"Reassurance that CF is now a mild condition, so there is little to worry about", fb:"CF care has improved a great deal, but this minimizes their concern and is not accurate."},
      {t:"Asking what questions, worries, and priorities matter most to them", ok:true},
      {t:"Contacting their relatives about the results on the couple's behalf to save time", fb:"Relatives may benefit from knowing, but sharing results is the couple's choice, often with help from a genetic counselor."},
      {t:"Trustworthy plain-language resources, such as MedlinePlus Genetics, to read at home", ok:true}],
     explain:"Genetic counseling, balanced information, and attention to the couple's own values all support informed decision-making. Health professionals provide accurate information and support; the couple makes the decisions."},
    {id:"c1-refl", type:"reflect", label:"Reflection 1", comp:["1.3b","1.3c"], reflId:"r1",
     prompt:function(){
       var f = firstChoiceText("c1-q4");
       return '<p>Taylor and Jordan&rsquo;s question about four children is a common misunderstanding. '+(f ? 'Your first answer to their question was: <em>'+f+'</em>' : '')+'</p>'+
       '<p>In at least 50 words, respond to <strong>both</strong> parts:</p><ol class="prompt-list"><li>Describe a time in your own work, training, or life when someone misunderstood a health risk or a number. What happened? (Leave out identifying details.)</li><li>How could a misunderstanding like Taylor and Jordan&rsquo;s shape the decisions a family makes? Describe how you would check, in your professional role, that a patient or family has truly understood risk information, and what you would do if they had not.</li></ol>';
     }}
  ]},
/* ===== CASE 2 ===== */
{ id:"c2", n:2, title:"Case 2: Huntington disease", short:"Huntington disease", pattern:"Autosomal dominant", level:"Moderate", mode:"standard", sys:"letter", variants:["H"],
  scenario:
    '<p>Morgan is 35. One of Morgan&rsquo;s parents has been diagnosed with Huntington disease (HD), a condition that affects the brain and causes changes in movement, thinking, and mood that worsen over time. Symptoms most often begin in a person&rsquo;s thirties or forties.</p>'+
    '<p>Morgan has never had genetic testing and is worried about having inherited the condition.</p>'+
    '<div class="callout"><strong>Good to know: no &ldquo;carriers&rdquo; in Huntington disease.</strong> Because one altered copy of the gene is enough to cause HD, there are no unaffected carriers the way there are for recessive conditions like CF. Risk comes mainly from family history. HD affects an estimated 3 to 7 per 100,000 people of European ancestry and appears less common in some other populations, but anyone with an affected parent has the same 1 in 2 chance of inheriting it. In rare cases, a person with HD does not have a parent with the disorder.</div>'+
    '<div class="callout"><strong>For this exercise:</strong> the affected parent has one disease-associated allele and one unaffected allele. Morgan&rsquo;s other biological parent does not carry the disease-associated allele. This simplified model assumes the disease-associated allele has an <em>HTT</em> gene expansion in the range that causes HD.'+
    '<ul class="notation"><li><span class="chip v">H</span> = Huntington disease-associated allele</li><li><span class="chip t">h</span> = unaffected allele</li></ul>'+
    '<p><strong>Watch the letters:</strong> in this case the capital letter is the disease-associated allele.</p></div>'+
    '<div class="quote">&ldquo;Does having a parent with Huntington disease mean I will develop it too?&rdquo;</div>',
  steps:[
    {id:"c2-pattern", type:"mc", label:"Identify the inheritance pattern", comp:["1.2a"],
     q:"Which inheritance pattern does Huntington disease follow?", instr:"Choose one.",
     options:[
      {t:"Autosomal recessive", fb:"If HD were recessive, a person would need two altered copies. In HD, one altered copy of the <em>HTT</em> gene is enough."},
      {t:"X-linked recessive", fb:"The <em>HTT</em> gene is on chromosome 4, an autosome, not the X chromosome."},
      {t:"Autosomal dominant", ok:true},
      {t:"There is not enough information to tell.", fb:"Think about how many altered copies a person needs to develop HD."}],
     explain:"HD is <strong>autosomal dominant</strong>: one altered copy of <em>HTT</em> is enough to cause the condition."},
    {id:"c2-geno", type:"mc", label:"Identify the parents' genotypes", comp:["1.2a"],
     q:"What is the cross between Morgan's parents (affected parent &times; other parent)?", instr:"Use the scenario. There is one correct answer.",
     options:[
      {t:"HH &times; hh", fb:"HH would mean two disease-associated alleles. The scenario says the affected parent has one."},
      {t:"Hh &times; Hh", fb:"Reread the scenario: Morgan's other parent does not carry the disease-associated allele."},
      {t:"hh &times; hh", fb:"If neither parent had H, no one in the family would be expected to have HD."},
      {t:"Hh &times; hh", ok:true}],
     explain:"Affected parent: <strong>Hh</strong>. Other parent: <strong>hh</strong>."},
    {id:"c2-square", type:"square", label:"Build the Punnett square", comp:["1.2a","1.3a"],
     topName:"Affected parent", sideName:"Other parent", top:["H","h"], side:["h","h"], pool:["H","h"], genos:["HH","Hh","hh"],
     instr:"<p>Put the <strong>affected parent's</strong> alleles across the top and the <strong>other parent's</strong> alleles down the side. Then fill in all four boxes.</p>",
     explain:"Two boxes are Hh and two are hh."},
    {id:"c2-prob", type:"prob", label:"Interpret the probabilities", comp:["1.3a"],
     q:"Based on the square, what was Morgan's chance at conception of each outcome?", instr:"Use your completed square.",
     rows:[{t:"Morgan inherited the disease-associated allele (Hh)", a:50},{t:"Morgan did not inherit it (hh)", a:50}],
     explain:"Before any testing, Morgan&rsquo;s chance of having inherited H is 50%. This is an <strong>inheritance probability, not Morgan&rsquo;s actual genotype</strong>. Only genetic testing could show which allele Morgan inherited."},
    {id:"c2-q3", type:"mc", label:"Apply it: answer Morgan's first question", comp:["1.2a","1.3a"],
     pre:'<div class="quote">&ldquo;Does having a parent with Huntington disease mean I will develop it too?&rdquo;</div>',
     q:"Which response is most accurate?", instr:"Choose one.",
     options:[
      {t:"&ldquo;Not necessarily. You had a 1 in 2 chance, and only genetic testing could show which you inherited.&rdquo;", ok:true},
      {t:"&ldquo;Yes. Because HD is a dominant condition, having an affected parent means you will develop it too.&rdquo;", fb:"Dominant means one copy is enough, but Morgan may not have inherited that copy. Look at your square."},
      {t:"&ldquo;Probably not. You are 35 and have no symptoms yet, so you have most likely avoided inheriting HD.&rdquo;", fb:"This is overly reassuring. HD symptoms often begin in the thirties or forties, so having no symptoms at 35 does not rule it out."},
      {t:"&ldquo;Your chance is about 1 in 4, because only one of your two parents has been diagnosed with HD.&rdquo;", fb:"Check your square: how many of the four boxes contain H?"}],
     explain:"Morgan&rsquo;s chance of having inherited H is 50%. The Punnett square shows chances; it cannot tell Morgan&rsquo;s genotype. In real life, HD is more complex than this model: some <em>HTT</em> expansions fall in a &ldquo;reduced penetrance&rdquo; range (36 to 39 CAG repeats), where some people develop symptoms and others do not."},
    {id:"c2-q4", type:"mc", label:"Clinical application: the testing question", comp:["1.3b"],
     pre:'<div class="quote">&ldquo;Should I have genetic testing to find out?&rdquo;</div>',
     q:"Which professional response is most appropriate?", instr:"Choose one.",
     options:[
      {t:"&ldquo;Yes. It is always better to know, so you should get tested as soon as possible and plan ahead.&rdquo;", fb:"This is overly directive. Testing is Morgan's choice, and some people decide not to test."},
      {t:"&ldquo;I would not. There is no cure, so knowing the result would probably just make you worry more.&rdquo;", fb:"This shares a personal opinion and steers Morgan away from testing. Respect Morgan's right to decide."},
      {t:"&ldquo;That is your decision, and people choose differently. Would talking with a genetic counselor first help?&rdquo;", ok:true},
      {t:"&ldquo;Let&rsquo;s not worry about testing yet. We can talk about it again if you start to notice symptoms.&rdquo;", fb:"This dismisses Morgan's concern and closes a conversation Morgan is asking to have."}],
     explain:"The best response acknowledges that the decision is Morgan&rsquo;s, respects the choice to test or not test, and recognizes the value of genetic counseling before predictive testing. Overly directive answers (either way) and overly reassuring answers both take the decision away from Morgan."},
    {id:"c2-q5", type:"mc", label:"Explain the decision", comp:["1.3b","1.3c"],
     q:"Why is that response the most appropriate?", instr:"Choose the reason that best connects the genetics, Morgan's situation, and your professional role.",
     options:[
      {t:"Adults who have a parent with HD are required to complete predictive testing before they turn 40 years old.", fb:"There is no such requirement. Predictive testing is voluntary."},
      {t:"Morgan has a 50% chance, and a result affects Morgan's emotions, plans, and family, so it is Morgan's choice.", ok:true},
      {t:"A genetic counselor is the person who decides for Morgan whether predictive testing is a good idea.", fb:"Genetic counselors support decision-making; they do not make the decision."},
      {t:"A positive result would only affect Morgan's own health plans, not anyone else in Morgan's family.", fb:"Genetic results often have implications for blood relatives, such as siblings or children."}],
     explain:"<strong>Predictive testing</strong> looks for a gene change in someone who has no symptoms yet. A result can bring relief, distress, or both. It can shape relationships and life plans, and it can reveal information about relatives&rsquo; risk too. That is why genetic counseling before predictive testing is commonly recommended, and why the decision stays with the person."},
    {id:"c2-refl", type:"reflect", label:"Reflection 2", comp:["1.3b","1.3c"], reflId:"r2",
     prompt:function(){
       var f = firstChoiceText("c2-q4");
       return '<p>Morgan is deciding whether to have predictive testing. '+(f ? 'The first response you chose for Morgan was: <em>'+f+'</em>' : '')+'</p>'+
       '<p>In at least 50 words, respond to <strong>all three</strong> parts:</p><ol class="prompt-list"><li>Name your professional role.</li><li>Describe one personal value, belief, or experience of yours that could shape how you respond to someone like Morgan.</li><li>Describe one specific thing you would say or do to make sure the decision stays Morgan&rsquo;s.</li></ol>';
     }}
  ]},
/* ===== CASE 3 ===== */
{ id:"c3", n:3, title:"Case 3: Hemophilia A", short:"Hemophilia A", pattern:"X-linked recessive", level:"Moderate to challenging", mode:"standard", sys:"x", variants:["Xh"],
  scenario:
    '<p>Alex has learned that she carries a familial variant in the <em>F8</em> gene, which is associated with hemophilia A. In hemophilia A, blood does not clot normally because the body makes too little of a clotting protein called factor VIII.</p>'+
    '<p>Alex and her partner are considering having children and want to understand the chances of passing the variant on.</p>'+
    '<div class="callout note"><strong>&ldquo;Carrier&rdquo; does not always mean &ldquo;no symptoms.&rdquo;</strong> People with one <em>F8</em> variant and one working copy are often called carriers. Many clot normally, but some make less factor VIII and have bleeding symptoms, which in rare cases are as serious as hemophilia A itself. A person with a variant whose factor VIII level is below 40% of normal is classified as having hemophilia. So anyone who carries a hemophilia A variant, including Alex, may need a clinical assessment, such as a factor VIII level, even when described as a carrier.</div>'+
    '<div class="callout"><strong>Good to know: no family history does not rule it out.</strong> Hemophilia affects people from all racial and ethnic groups. Most people with hemophilia inherit it, but about one third of babies diagnosed with hemophilia have a new variant that is not present in other family members.</div>'+
    '<div class="callout"><strong>For this exercise:</strong> Alex has two X chromosomes, one with the familial variant and one without it. Her partner has one X chromosome without the variant and one Y chromosome.'+
    '<ul class="notation"><li><span class="chip t">X<sup>H</sup></span> = X chromosome without the familial variant</li><li><span class="chip v">X<sup>h</sup></span> = X chromosome carrying the familial variant</li><li><span class="chip y">Y</span> = Y chromosome</li></ul></div>'+
    '<div class="quote">&ldquo;How do the chances differ for a child who inherits an X chromosome from the partner versus a child who inherits a Y chromosome?&rdquo;</div>'+
    '<p class="instr">From here on, you will build squares on your own. Genetics Help is available anytime from the top of the page.</p>',
  steps:[
    {id:"c3-pattern", type:"mc", label:"Identify the inheritance pattern", comp:["1.2a"],
     q:"Which inheritance pattern does hemophilia A follow?", instr:"Choose one.",
     options:[
      {t:"Autosomal dominant", fb:"If one copy always caused hemophilia A, Alex would be expected to have it. Also, where is the <em>F8</em> gene located?"},
      {t:"Autosomal recessive", fb:"The <em>F8</em> gene is on the X chromosome, not an autosome."},
      {t:"Y-linked", fb:"The variant is on one of Alex's X chromosomes."},
      {t:"X-linked recessive", ok:true}],
     explain:"Hemophilia A is <strong>X-linked recessive</strong>; the <em>F8</em> gene is on the X chromosome. A person with one X chromosome (XY) who inherits the variant has hemophilia A, because there is no second X with a working copy. A person with two X chromosomes and one variant is usually a carrier."},
    {id:"c3-geno", type:"mc", label:"Identify the parents' genotypes", comp:["1.2a"],
     q:"What is the cross (Alex &times; partner)?", instr:"Use the scenario. There is one correct answer.",
     options:[
      {t:Xh+Xh+" &times; "+XH+"Y", fb:"That would mean the variant is on both of Alex's X chromosomes."},
      {t:XH+Xh+" &times; "+Xh+"Y", fb:"The partner's X chromosome does not carry the variant."},
      {t:XH+Xh+" &times; "+XH+"Y", ok:true},
      {t:XH+XH+" &times; "+XH+"Y", fb:"Alex carries the variant on one X chromosome."}],
     explain:"Alex: <strong>X<sup>H</sup>X<sup>h</sup></strong>. Partner: <strong>X<sup>H</sup>Y</strong>."},
    {id:"c3-square", type:"square", label:"Build the Punnett square", comp:["1.2a","1.3a"],
     topName:"Alex", sideName:"Partner", top:["XH","Xh"], side:["XH","Y"], pool:["XH","Xh","Y"], genos:["XHXH","XHXh","XhXh","XHY","XhY"],
     instr:"<p>Put <strong>Alex's</strong> chromosomes across the top and the <strong>partner's</strong> down the side. Then fill in all four boxes.</p>",
     explain:"The four boxes are X<sup>H</sup>X<sup>H</sup>, X<sup>H</sup>X<sup>h</sup>, X<sup>H</sup>Y, and X<sup>h</sup>Y."},
    {id:"c3-prob", type:"prob", label:"Calculate the probabilities", comp:["1.3a"],
     q:"Within this simplified model, what is each chance?", instr:"Use your completed square. Read each row carefully: some rows ask about <strong>all children</strong>, and some ask about <strong>only one group</strong> of children. You will see the matching genotypes after you check your answers.",
     rows:[
      {t:"Out of all children: chance of a child expected to have hemophilia A", a:25, g:"X<sup>h</sup>Y"},
      {t:"Out of all children: chance of a child who is a carrier", a:25, g:"X<sup>H</sup>X<sup>h</sup>"},
      {t:"Only children who inherit the partner's <strong>Y</strong>: chance of hemophilia A", a:50, g:"X<sup>h</sup>Y is 1 of the 2 boxes with Y"},
      {t:"Only children who inherit the partner's <strong>X</strong>: chance of being a carrier", a:50, g:"X<sup>H</sup>X<sup>h</sup> is 1 of the 2 boxes with the partner's X"}],
     explain:"<p>Your four boxes are X<sup>H</sup>X<sup>H</sup> (no variant), X<sup>H</sup>X<sup>h</sup> (carrier), X<sup>H</sup>Y (no variant, no hemophilia A), and X<sup>h</sup>Y (hemophilia A expected). Each box is 25% of all children, so 25% overall are expected to have hemophilia A and 25% are expected to be carriers.</p>"+
       "<p><strong>Why do children who get the partner&rsquo;s Y have a higher chance of hemophilia A?</strong> The Y chromosome does not carry the variant and does not cause hemophilia. It simply has no <em>F8</em> gene. A child who gets the partner&rsquo;s Y therefore has only one X chromosome, the one from Alex. Alex passes on either her X with the variant or her X without it, with equal chances. If the child gets the X with the variant, there is no second X with a working <em>F8</em> copy to make up for it, so hemophilia A is expected. That is 1 of the 2 Y boxes, or 50%.</p>"+
       "<p><strong>Children who get the partner&rsquo;s X</strong> have the same 50% chance of getting Alex&rsquo;s variant. But the partner&rsquo;s X has a working copy of <em>F8</em>, which usually makes enough factor VIII. So these children are expected to be carriers rather than have hemophilia A, although some carriers do have bleeding symptoms.</p>"+
       "<p><strong>The key idea:</strong> the variant can only come from Alex. The chromosome from the partner decides whether the child has a working backup copy. These chances apply to each pregnancy.</p>"},
    {id:"c3-q3", type:"mc", label:"Clinical interpretation", comp:["1.2a","1.3a"],
     pre:'<div class="quote">&ldquo;Do all of our children have the same chance of inheriting the variant and having symptoms?&rdquo;</div>',
     q:"Which response is most accurate?", instr:"Choose one.",
     options:[
      {t:"&ldquo;Yes. Every child has the same 25% chance of having hemophilia A, no matter which chromosomes they inherit.&rdquo;", fb:"25% is the overall chance, but it is not the same for every child. It depends on which chromosome a child gets from the partner."},
      {t:"&ldquo;No. Each child has a 50% chance of getting Alex&rsquo;s variant; what it means depends on the partner&rsquo;s X or Y.&rdquo;", ok:true},
      {t:"&ldquo;No. Only children who inherit the partner&rsquo;s Y chromosome are able to inherit the variant at all.&rdquo;", fb:"The variant comes from Alex, so any child can inherit it. What differs is what happens when they do."},
      {t:"&ldquo;No. Children who get the partner&rsquo;s X can carry the variant but can never have bleeding symptoms.&rdquo;", fb:"Some carriers have lower factor VIII levels and bleeding symptoms."}],
     explain:"Each child has a 50% chance of inheriting Alex&rsquo;s variant. A child who gets it along with the partner&rsquo;s Y is expected to have hemophilia A. A child who gets it along with the partner&rsquo;s X is expected to be a carrier. Inheriting a variant and having symptoms are not the same thing. Carriers usually make enough factor VIII, but some make less than usual and are at risk of abnormal bleeding. Real-world expression is more complex than a Punnett square shows."},
    {id:"c3-q4", type:"ms", label:"Professional application", comp:["1.3b","1.3c"],
     q:"What would be important to communicate when discussing these findings with the family?", instr:"Select <strong>all</strong> that apply.",
     options:[
      {t:"The chances differ depending on whether a child inherits the partner's X or Y chromosome", ok:true},
      {t:"Which reproductive option they should choose to avoid a child with hemophilia A", fb:"Decisions about having children belong to the family. Your role is accurate information and support."},
      {t:"The same chances apply to each pregnancy, no matter what happened before", ok:true},
      {t:"Carriers, including Alex, can have bleeding symptoms and may need a factor VIII level", ok:true},
      {t:"That only their first child is at risk, since chances drop in later pregnancies", fb:"The same chances apply to every pregnancy."},
      {t:"A referral to genetic counseling and, when needed, a hemophilia treatment center", ok:true},
      {t:"That a child with hemophilia A would not usually need any specialized care", fb:"Hemophilia A usually needs specialized, ongoing care."}],
     explain:"Clear, accurate information plus appropriate referral helps the family make their own decisions. Knowing when someone may need further evaluation, including Alex, is part of good follow-up."},
    {id:"c3-refl", type:"reflect", label:"Reflection 3", comp:["1.3b","1.3c"], reflId:"r3",
     prompt:function(){
       return '<p>Think about the setting where you work or train.</p>'+
       '<p>In at least 50 words, respond to <strong>both</strong> parts:</p><ol class="prompt-list"><li>Who on your team, or which service in your setting, would you involve to support Alex&rsquo;s family, and what would you do or say first? Be specific to your own role and setting.</li><li>Explain how the difference between <em>inheriting a variant</em> and <em>having symptoms</em> would change what you tell this family.</li></ol>';
     }}
  ]},
/* ===== CASE 4 ===== */
{ id:"c4", n:4, title:"Case 4: Sickle cell disease", short:"Sickle cell disease", pattern:"Autosomal recessive", level:"Independent clinical application", mode:"independent", sys:"hb", variants:["HbS"],
  scenario:
    '<p>Sam and Riley are planning a family. Both have sickle cell trait. They understand that sickle cell trait is different from sickle cell disease, but they are not sure about their children&rsquo;s chances of having either one.</p>'+
    '<p>Sickle cell disease is a group of inherited red blood cell conditions caused by abnormal hemoglobin, the protein in red blood cells that carries oxygen. People with sickle cell trait usually have no symptoms.</p>'+

function stepDone(s){
  if (s.type === "reflect"){ var r = state.refl[s.reflId]; return !!(r && r.submitted && words(r.text) >= 50); }
  var it = state.items[s.id]; return !!(it && it.done);
}
function caseDone(c){ return c.steps.every(stepDone); }
function caseStarted(c){ return c.steps.some(function(s){ var it = state.items[s.id]; return (it && it.attempts > 0) || (s.type==="square" && state.squares[s.id]); }); }
function closingDone(){ return stepDone(CLOSING); }
function completionPoints(){ return CASES.filter(caseDone).length * 12.5; }
function fmtPts(n){ return (Math.round(n*10)/10).toString(); }
function firstChoiceText(id){
  var s = findStep(id); var it = state.items[id];
  if (!s || !it || it.firstAnswer == null || s.type !== "mc") return "";

function findStep(id){ for (var i=0;i<CASES.length;i++){ for (var j=0;j<CASES[i].steps.length;j++){ if (CASES[i].steps[j].id === id) return CASES[i].steps[j]; } } return id === CLOSING.id ? CLOSING : null; }
function caseOf(id){ for (var i=0;i<CASES.length;i++){ if (CASES[i].steps.some(function(s){ return s.id === id; })) return CASES[i]; } return null; }

var SCREENS = [{id:"welcome", label:"Welcome"},{id:"refresher", label:"Refresher"}]

  .concat([{id:"closing", label:"Reflect"},{id:"summary", label:"Summary"}]);
function unlocked(id){
  if (id === "welcome" || id === "refresher" || id === "c1") return true;
  if (id === "c2") return caseDone(CASES[0]);
  if (id === "c3") return caseDone(CASES[1]);

}

function go(id){
  if (!unlocked(id)){ announce("That section unlocks after you complete the previous one."); return; }

function render(focusId, newScreen){
  renderProgress();
  var el = $("#screen");
  var s = state.screen;
  if (!unlocked(s)) s = state.screen = "welcome";
  if (s === "welcome") el.innerHTML = renderWelcome();
  else if (s === "refresher") el.innerHTML = renderRefresherScreen();
  else if (s === "closing") el.innerHTML = renderClosing();
  else if (s === "summary") el.innerHTML = renderSummary();
  else el.innerHTML = renderCase(CASES.filter(function(c){ return c.id === s; })[0]);
  bindScreen();
  if (focusId){ var f = document.getElementById(focusId); if (f){ f.focus({preventScroll:true}); f.scrollIntoView({block:"center", behavior: reduceMotion() ? "auto" : "smooth"}); } }
  else if (newScreen){ var h = $("#screen h1"); if (h) h.focus(); }
}

function refresherContent(pfx){
  return '<p>This quick review is optional and is not graded. Open any topic you want to revisit.</p>'+
  '<details><summary>Key terms</summary><dl class="terms">'+
  '<dt>Gene</dt><dd>A section of DNA that carries instructions, often for making a protein.</dd>'+
  '<dt>Allele</dt><dd>One version of a gene. You inherit one allele of each gene from each biological parent.</dd>'+
  '<dt>Dominant and recessive</dt><dd>A <strong>dominant</strong> allele shows its effect even when only one copy is present. A <strong>recessive</strong> allele shows its effect only when two copies are present (or, for genes on the X chromosome, when there is no second X).</dd>'+
  '<dt>Genotype and phenotype</dt><dd>The <strong>genotype</strong> is the pair of alleles a person has (for example, Ff). The <strong>phenotype</strong> is the trait or condition you can observe (for example, &ldquo;has CF&rdquo; or &ldquo;does not have CF&rdquo;).</dd>'+
  '<dt>Homozygous and heterozygous</dt><dd><strong>Homozygous</strong> means two of the same allele (FF or ff). <strong>Heterozygous</strong> means two different alleles (Ff).</dd>'+
  '<dt>Carrier</dt><dd>A person with one copy of a recessive disease-associated allele who usually does not have the condition but can pass the allele on.</dd></dl></details>'+
  '<details><summary>Autosomal dominant inheritance</summary><p>The gene is on an autosome (one of the 22 numbered chromosome pairs). One copy of the disease-associated allele is enough to cause the condition. A parent with one copy has a 50% chance of passing it to each child.</p></details>'+
  '<details><summary>Autosomal recessive inheritance</summary><p>The gene is on an autosome. A person needs two copies of the disease-associated allele, one from each parent, to have the condition. When both parents are carriers, each pregnancy has a 25% chance of a child with the condition, 50% chance of a carrier child, and 25% chance of a child with neither variant.</p></details>'+
  '<details><summary>X-linked recessive inheritance (and why the Y chromosome matters)</summary>'+
    '<p>The gene is on the X chromosome. Most people have either two X chromosomes (XX) or one X and one Y (XY). The Y chromosome is much smaller and does not carry a copy of most X-chromosome genes.</p>'+
    '<p><strong>Each child gets one sex chromosome from each parent.</strong> The parent with XX always passes on one of their X chromosomes. The parent with XY passes on either their X or their Y.</p>'+
    '<ul><li>A child who gets the <strong>Y</strong> has only one X, the one from the XX parent. If that X carries a recessive variant, there is no second X with a working copy to make up for it, so the child is expected to have the condition.</li>'+
    '<li>A child who gets the <strong>X</strong> from the XY parent has two X chromosomes. If only one carries the variant, the other usually provides enough working copy, so the child is usually a carrier. Some carriers still have symptoms.</li></ul>'+
    '<p><strong>The Y chromosome does not cause the condition or carry the variant.</strong> It matters because it leaves the child without a backup copy of the gene.</p></details>'+
  '<details><summary>How a Punnett square works</summary><p>A Punnett square is a grid that shows every possible combination of one allele from each parent. One parent&rsquo;s alleles go across the top, and the other parent&rsquo;s go down the side. Each box combines the allele at the top of its column with the allele at the start of its row. In a 2 &times; 2 square, each box is one of four equally likely outcomes, so each box equals 25%.</p></details>'+
  '<div class="card" style="margin-top:.8rem"><h3 style="margin-top:0">Try it: an example square</h3><p class="instr">Choose a genotype for each parent and watch the square fill in. Here, A is a dominant allele and a is a recessive allele. (In the graded cases, you will build the squares yourself.)</p>'+
  '<div class="mini-controls"><label>Parent 1 (top)<select id="'+pfx+'p1"><option>AA</option><option selected>Aa</option><option>aa</option></select></label><label>Parent 2 (side)<select id="'+pfx+'p2"><option>AA</option><option selected>Aa</option><option>aa</option></select></label></div>'+
  '<div id="'+pfx+'out" aria-live="polite"></div></div>'+
  '<div class="card"><h3 style="margin-top:0">Try it: an X-linked example</h3><p class="instr">X<sup>H</sup> is an X chromosome with a working copy of the gene. X<sup>h</sup> is an X chromosome with a recessive variant. Choose each parent and see what happens for children who get an X versus a Y from the XY parent.</p>'+
  '<div class="mini-controls"><label>Parent with XX (top)<select id="'+pfx+'x1"><option value="XHXH">XH XH (no variant)</option><option value="XHXh" selected>XH Xh (carrier)</option><option value="XhXh">Xh Xh (two variants)</option></select></label><label>Parent with XY (side)<select id="'+pfx+'x2"><option value="XHY" selected>XH Y (no variant)</option><option value="XhY">Xh Y (has the condition)</option></select></label></div>'+
  '<div id="'+pfx+'xout" aria-live="polite"></div></div>';
}
function miniXSquare(pfx){
  var a = $("#"+pfx+"x1"), b = $("#"+pfx+"x2"), out = $("#"+pfx+"xout");
  if (!a || !b || !out) return;
  var t = a.value.match(/XH|Xh|Y/g), s = b.value.match(/XH|Xh|Y/g);
  var rows = s.map(function(r){ return '<tr><th scope="row">'+alleleHTML(r)+'</th>'+t.map(function(c){ return '<td>'+genoHTML(combine(c, r, "x"), "x")+'</td>'; }).join("")+'</tr>'; }).join("");
  function describe(g){ if (g.indexOf("Y") > -1) return g === "XhY" ? "has the condition" : "no variant"; if (g === "XhXh") return "has the condition"; if (g === "XHXh") return "carrier"; return "no variant"; }
  function group(r){ var res = {}; t.forEach(function(c){ var d = describe(combine(c, r, "x")); res[d] = (res[d]||0) + 50; }); return Object.keys(res).map(function(k){ return res[k]+"% "+k; }).join(", "); }

/* --- Punnett square --- */
function sq(id){ if (!state.squares[id]) state.squares[id] = {top:[null,null], side:[null,null], cells:[null,null,null,null], active:null, marks:{}}; return state.squares[id]; }
function slotName(s, key){
  var p = key.split("-");
  if (p[0] === "top") return "Top spot "+(+p[1]+1)+", "+s.topName+"'s allele";
  if (p[0] === "side") return "Side spot "+(+p[1]+1)+", "+s.sideName+"'s allele";
  var r = Math.floor(+p[1]/2)+1, col = (+p[1]%2)+1;
  return "Box in row "+r+", column "+col;
}
function slotVal(q, key){ var p = key.split("-"); return p[0]==="cell" ? q.cells[+p[1]] : q[p[0]][+p[1]]; }
function setSlot(q, key, v){ var p = key.split("-"); if (p[0]==="cell") q.cells[+p[1]] = v; else q[p[0]][+p[1]] = v; }
var SLOT_ORDER = ["top-0","top-1","side-0","side-1","cell-0","cell-1","cell-2","cell-3"];

function slotBtn(c, s, q, key, done){
  var v = slotVal(q, key), isCell = key.indexOf("cell") === 0;

function renderSquare(c, s){

/* ---------- Checking answers ---------- */
function setFB(it, k, h){ it.fb = {k:k, h:h}; }
function hintAllowed(c, it){ return !(c && c.mode === "independent" && it.attempts < 2); }

function checkMC(s){
  var c = caseOf(s.id), it = item(s.id);
  var sel = $('input[name="'+s.id+'-r"]:checked');
  if (!sel){ setFB(it, "info", "Choose an answer first."); return; }
  var i = +sel.value; it.answer = i; it.attempts++;
  if (it.attempts === 1){ it.firstAnswer = i; it.firstCorrect = !!s.options[i].ok; }
  if (s.options[i].ok){ it.done = true; setFB(it, "ok", '<strong class="v">&#10003; Correct.</strong>'+s.explain); }
  else {
    var hint = hintAllowed(c, it) ? s.options[i].fb : "Reread the scenario and try again.";
    setFB(it, "no", '<strong class="v">&#10007; Not quite. Try again.</strong>'+hint+(it.attempts>=3?'<br>You can also choose <em>Show me the answer</em>.':''));
  }
}
function checkMS(s){
  var c = caseOf(s.id), it = item(s.id);
  var sel = $all('input[data-ms="'+s.id+'"]:checked').map(function(e){ return +e.value; });
  if (!sel.length){ setFB(it, "info", "Select at least one answer first."); return; }
  it.answer = sel; it.attempts++;
  var right = s.options.map(function(o,i){ return o.ok ? i : -1; }).filter(function(i){ return i>-1; });
  var hits = sel.filter(function(i){ return s.options[i].ok; }).length, wrong = sel.filter(function(i){ return !s.options[i].ok; });
  var ok = hits === right.length && wrong.length === 0;
  if (it.attempts === 1){ it.firstAnswer = sel.slice(); it.firstCorrect = ok; }
  if (ok){ it.done = true; setFB(it, "ok", '<strong class="v">&#10003; Correct.</strong>'+s.explain); return; }
  var msg = '<strong class="v">&#10007; Not quite. Try again.</strong>You chose '+hits+' of the '+right.length+' helpful answers'+(wrong.length?', plus '+wrong.length+' that '+(wrong.length===1?'does':'do')+' not fit':'')+'.';
  if (hintAllowed(c, it) && it.attempts >= 2 && wrong.length) msg += '<ul>'+wrong.map(function(i){ return '<li>'+s.options[i].fb+'</li>'; }).join("")+'</ul>';
  else if (hintAllowed(c, it) && it.attempts >= 2 && hits < right.length) msg += ' Look again for responses that give accurate information, involve the right support, or respect the family&rsquo;s choices.';
  setFB(it, "no", msg);
}
function checkProb(s){
  var c = caseOf(s.id), it = item(s.id);
  var vals = s.rows.map(function(r,i){ var e = document.getElementById(s.id+"-p"+i); return e && e.value !== "" ? +e.value : null; });
  it.answer = vals;
  if (vals.some(function(v){ return v === null; })){ setFB(it, "info", "Choose a percentage for every row first."); return; }
  it.attempts++;
  var marks = s.rows.map(function(r,i){ return vals[i] === r.a ? "ok" : "no"; });
  var nOk = marks.filter(function(m){ return m==="ok"; }).length, ok = nOk === s.rows.length;
  if (it.attempts === 1){ it.firstAnswer = vals.slice(); it.firstCorrect = ok; }
  if (ok){ it.done = true; it.marks = []; setFB(it, "ok", '<strong class="v">&#10003; Correct.</strong>'+s.explain); return; }
  var show = hintAllowed(c, it);
  it.marks = (show && it.attempts >= 2) || (c.mode === "guided") ? marks : [];
  setFB(it, "no", '<strong class="v">&#10007; Not quite. Try again.</strong>'+nOk+' of '+s.rows.length+' are correct.'+(show?' Count the boxes in your completed square that match each description. Each box is 25%.':'')+(it.marks.length?' Rows that need another look are marked.':''));
}
function checkSquare(s){
  var c = caseOf(s.id), it = item(s.id), q = sq(s.id);
  var all = SLOT_ORDER.every(function(k){ return !!slotVal(q,k); });
  if (!all){ setFB(it, "info", "Fill in all eight spots first: two across the top, two down the side, and the four boxes."); return; }
  it.attempts++;
  var marks = {}, hdrOK = true;
  var ms = function(a, b){ return a.slice().sort().join() === b.slice().sort().join(); };
  var topOK = ms(q.top, s.top), sideOK = ms(q.side, s.side);
  ["top-0","top-1"].forEach(function(k){ marks[k] = topOK ? "ok" : "no"; });
  ["side-0","side-1"].forEach(function(k){ marks[k] = sideOK ? "ok" : "no"; });
  hdrOK = topOK && sideOK;
  var badCells = 0;
  for (var i=0;i<4;i++){ var exp = combine(q.side[Math.floor(i/2)], q.top[i%2], c.sys); var ok = q.cells[i] === exp; marks["cell-"+i] = ok ? "ok" : "no"; if (!ok) badCells++; }
  var ok = hdrOK && badCells === 0;
  if (it.attempts === 1){ it.firstAnswer = JSON.parse(JSON.stringify({top:q.top, side:q.side, cells:q.cells})); it.firstCorrect = ok; }
  if (ok){ it.done = true; q.active = null; q.marks = {}; setFB(it, "ok", '<strong class="v">&#10003; Your square is correct.</strong>'+s.explain); return; }
  var show = hintAllowed(c, it), detail = (c.mode === "guided") || (show && it.attempts >= 2);
  q.marks = detail ? marks : {};
  var msg = '<strong class="v">&#10007; Not quite. Try again.</strong>';
  if (!hdrOK){
    msg += !topOK ? 'Check the alleles across the top. They should be <strong>'+esc(s.topName)+'&rsquo;s</strong> two alleles from the genotype you identified. ' : '';
    msg += !sideOK ? 'Check the alleles down the side. They should be <strong>'+esc(s.sideName)+'&rsquo;s</strong> two alleles. ' : '';
  }
  if (badCells) msg += badCells+' of the 4 boxes '+(badCells===1?'does':'do')+' not match '+(hdrOK?'':'the alleles you placed on ')+'the top and side. '+(show?'Each box combines the allele at the top of its column with the allele at the start of its row.':'');
  if (detail) msg += ' Spots that need another look are marked &ldquo;check.&rdquo;';
  setFB(it, "no", msg);
}
function reveal(id){
  var s = findStep(id), c = caseOf(id), it = item(id);
  it.done = true; it.revealed = true;
  if (s.type === "mc"){ setFB(it, "info", '<strong class="v">Here is the answer.</strong>The correct answer is marked above. '+s.explain); }
  else if (s.type === "ms"){ setFB(it, "info", '<strong class="v">Here are the answers.</strong>The helpful answers are marked above. '+s.explain); }
  else if (s.type === "prob"){ it.answer = s.rows.map(function(r){ return r.a; }); setFB(it, "info", '<strong class="v">Here are the answers.</strong>'+s.explain); }
  else if (s.type === "square"){ sq(id).marks = {}; sq(id).active = null; setFB(it, "info", '<strong class="v">Here is the correct square.</strong>Compare it with yours to see where the alleles go. '+s.explain); }
}

var reflTimer = null;

  var n1 = $("#nameInput") || $("#nameInput2");
  if (n1) n1.addEventListener("input", function(e){ state.name = e.target.value.slice(0,80); save(); });
  if (state.screen === "refresher") bindMini("rf-");
  $all("textarea[data-refl]", scr).forEach(function(ta){
    var s = findStep(ta.getAttribute("data-refl")), r = refl(s.reflId);

      r.text = ta.value;
      var wc = words(ta.value), w = document.getElementById(s.id+"-wc");
      w.textContent = wcText(wc); w.className = "wc"+(wc>=50?" ok":"");
      if (r.submitted && wc < 50){ r.submitted = false; }
      clearTimeout(reflTimer); reflTimer = setTimeout(function(){ save(); renderProgress(); }, 400);
    });
    ta.addEventListener("paste", function(e){
      var t = ""; try { t = (e.clipboardData || window.clipboardData).getData("text") || ""; } catch(x){}
      r.pasted = true; r.pasteChars += t.length; save();
    });
  });
}

document.addEventListener("click", function(e){
  var t = e.target.closest("button, a"); if (!t) return;
  if (t.hasAttribute("data-go")){ e.preventDefault(); if (t.getAttribute("aria-disabled") === "true"){ announce("That section unlocks after you complete the previous one."); return; } go(t.getAttribute("data-go")); return; }
  if (t.hasAttribute("data-check")){
    var id = t.getAttribute("data-check"), s = findStep(id);
    if (s.type === "mc") checkMC(s); else if (s.type === "ms") checkMS(s); else if (s.type === "prob") checkProb(s); else if (s.type === "square") checkSquare(s);
    save(); var it = item(id);
    if (it.done){
      var c = caseOf(id), nxt = c.steps[c.steps.indexOf(s)+1];
      render(nxt ? nxt.id+"-h" : c.id+"-done");
      announce("Correct. " + (nxt ? "Next step: " + nxt.label + "." : "Case " + c.n + " complete."));
    } else { render(id+"-fb-focus"); var fb = document.getElementById(id+"-fb"); if (fb){ fb.setAttribute("tabindex","-1"); fb.focus(); } }
    return;
  }
  if (t.hasAttribute("data-reveal")){
    var rid = t.getAttribute("data-reveal"); reveal(rid); save();
    render(rid+"-h"); var fb2 = document.getElementById(rid+"-fb"); if (fb2){ fb2.setAttribute("tabindex","-1"); fb2.focus(); }
    announce("Answer shown. Read the explanation, then continue to the next step below.");
    return;
  }
  if (t.hasAttribute("data-slot")){
    var sid = t.getAttribute("data-slot"), key = t.getAttribute("data-key"), q = sq(sid);
    q.active = (q.active === key) ? null : key; save();
    render(q.active ? sid+"-opt0" : sid+"-"+key);
    return;
  }
  if (t.hasAttribute("data-pick")){
    var pid = t.getAttribute("data-pick"), pq = sq(pid), val = t.getAttribute("data-val"), k = pq.active;
    if (!k) return;
    setSlot(pq, k, val || null); delete pq.marks[k];
    var ps = findStep(pid), pc = caseOf(pid);
    var said = val ? (k.indexOf("cell")===0 ? genoSpeak(val, pc.sys) : (SPEAK[val]||val)) : "cleared";
    var nextKey = null, start = SLOT_ORDER.indexOf(k);
    for (var j=1;j<=SLOT_ORDER.length;j++){ var kk = SLOT_ORDER[(start+j)%SLOT_ORDER.length]; if (!slotVal(pq, kk)){ nextKey = kk; break; } }
    pq.active = val ? nextKey : k; save();
    render(pq.active ? (val ? pid+"-opt0" : pid+"-"+k) : pid+"-checkbtn");
    announce(slotName(ps, k)+": "+said+"."+(val && nextKey ? " Now choosing for "+slotName(ps, nextKey)+"." : (val ? " All spots filled. You can check your square." : "")));
    return;
  }
  if (t.hasAttribute("data-pickclose")){ var cid = t.getAttribute("data-pickclose"), cq = sq(cid), was = cq.active; cq.active = null; save(); render(cid+"-"+was); return; }
  if (t.hasAttribute("data-savereflect")){
    var rsid = t.getAttribute("data-savereflect"), rs = findStep(rsid), rr = refl(rs.reflId);
    var ta = document.getElementById(rsid+"-ta"); rr.text = ta.value; var wc = words(rr.text);
    if (wc < 50){ var f3 = document.getElementById(rsid+"-fb"); f3.innerHTML = '<div class="box no"><strong class="v">Not saved yet.</strong>Your reflection has '+wc+' words. Please write at least 50 words.</div>'; f3.setAttribute("tabindex","-1"); f3.focus(); save(); return; }
    rr.submitted = true; save();
    var rc = caseOf(rsid);
    if (rc){ render(caseDone(rc) ? rc.id+"-done" : rsid+"-fb"); announce("Reflection saved." + (caseDone(rc) ? " Case "+rc.n+" complete." : "")); }
    else { render(rsid+"-fb"); announce("Reflection saved. You can now see your summary."); }
    return;
  }
  if (t.id === "clearAsk"){
    $("#clearWrap").innerHTML = '<p role="alert"><strong>Erase all your answers and reflections on this device?</strong> This cannot be undone. Save your PDF first if you need it.</p><div class="row"><button type="button" class="btn btn-danger" id="clearYes">Yes, erase and start over</button><button type="button" class="btn btn-secondary" id="clearNo">Cancel</button></div>';
    $("#clearNo").focus(); return;
  }
  if (t.id === "clearNo"){ render("clearAsk"); return; }
  if (t.id === "clearYes"){ try { localStorage.removeItem(KEY); } catch(x){} state = blankState(); save(); render(null, true); announce("Your data was cleared. You are back at the start."); return; }
  if (t.id === "printBtn"){ buildRecord(); window.print(); return; }
  if (t.id === "dlBtn"){ downloadRecord(); return; }
  if (t.id === "helpBtn"){ openHelp(); return; }
  if (t.id === "helpClose"){ $("#helpDialog").close(); return; }
});
document.addEventListener("change", function(e){
  var t = e.target;
  if (t.matches('input[type=radio]')){ var id = t.name.replace(/-r$/,""); var it = item(id); it.answer = +t.value; save(); $all('input[name="'+t.name+'"]').forEach(function(x){ x.closest(".opt").classList.toggle("sel", x.checked); }); }
  if (t.matches('input[data-ms]')){ var mid = t.getAttribute("data-ms"); item(mid).answer = $all('input[data-ms="'+mid+'"]:checked').map(function(x){ return +x.value; }); t.closest(".opt").classList.toggle("sel", t.checked); save(); }
  if (t.matches('select[data-prob]')){ var pid = t.getAttribute("data-prob"), pit = item(pid); pit.answer = pit.answer || []; pit.answer[+t.getAttribute("data-i")] = t.value === "" ? null : +t.value; save(); }
});
document.addEventListener("keydown", function(e){

/* ---------- Completion record ---------- */
function answerText(s){
  var it = state.items[s.id]; if (!it) return "Not attempted";
  if (s.type === "mc") return it.answer != null ? s.options[it.answer].t : "No answer";
  if (s.type === "ms") return (it.answer||[]).map(function(i){ return "&bull; "+s.options[i].t; }).join("<br>") || "No answer";
  if (s.type === "prob") return s.rows.map(function(r,i){ return r.t+": "+((it.answer||[])[i]!=null?(it.answer[i]+"%"):"blank"); }).join("<br>");
  return "";
}
function statusText(s){
  var it = state.items[s.id]; if (!it || !it.attempts) return it && it.revealed ? "Answer shown" : "Not attempted";
  var t = it.done ? (it.revealed ? "Completed (answer shown after "+it.attempts+" tries)" : "Correct") : "In progress";
  t += "; "+it.attempts+(it.attempts===1?" try":" tries")+"; first try "+(it.firstCorrect?"correct":"incorrect");
  return t;
}
function reflRecord(s){
  var r = state.refl[s.reflId] || {text:"", pasted:false, pasteChars:0}, wc = words(r.text);
  return '<h3>'+esc(s.label)+'</h3><div class="prompt">'+s.prompt()+'</div><p><strong>Response ('+wc+' words)'+(r.pasted?'; note: includes pasted text (about '+r.pasteChars+' characters pasted)':'')+':</strong></p><div class="refl-text">'+(esc(r.text)||"(No response)")+'</div>';
}
function recordHTML(){
  var pts = completionPoints(), st = compStats(), now = new Date();
  var h = '<h1>Completion Record: Genetics in Practice: Four Clinical Cases</h1>'+
    '<p><strong>Name:</strong> '+(esc(state.name)||"(not entered)")+'<br><strong>Date:</strong> '+now.toLocaleString()+'<br><strong>Course:</strong> Genetics and Genomics</p>'+
    '<table class="data"><tr><th>Completion points (page-scored)</th><td>'+fmtPts(pts)+' / 50</td></tr><tr><th>Reflection points (instructor-scored)</th><td>___ / 50</td></tr><tr><th>Total</th><td>___ / 100</td></tr></table>'+
    '<h2>Case completion</h2><table class="data"><tr><th>Case</th><th>Pattern</th><th>Status</th></tr>'+CASES.map(function(c){ return '<tr><td>'+esc(c.short)+'</td><td>'+esc(c.pattern)+'</td><td>'+(caseDone(c)?"Complete (12.5 points)":"Not complete")+'</td></tr>'; }).join("")+'</table>'+
    '';
  CASES.forEach(function(c){
    h += '<h2>'+esc(c.title)+'</h2>';
    c.steps.forEach(function(s){
      if (s.type === "reflect"){ h += reflRecord(s); return; }
      if (s.type === "square"){ h += '<h3>'+esc(s.label)+' ('+esc(s.topName)+' on top, '+esc(s.sideName)+' on side)</h3>'+studentSquareTable(c, s)+'<p><em>'+statusText(s)+'</em></p>'; return; }
      h += '<h3>'+esc(s.label)+'</h3><p>'+s.q+'</p><p>'+answerText(s)+'</p><p><em>'+statusText(s)+'</em></p>';
    });
  });
  h += '<h2>Closing reflection</h2>'+reflRecord(CLOSING);
  h += '<p style="margin-top:14pt;font-size:9pt">Generated by the Genetics in Practice activity. Fictional cases; simplified inheritance models.</p>';
  return h;
}
function buildRecord(){ $("#record").innerHTML = recordHTML(); }
function downloadRecord(){
  var doc = '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Genetics in Practice record</title><style>body{font-family:Arial,sans-serif;max-width:50rem;margin:1.5rem auto;padding:0 1rem;line-height:1.5;color:#111}table{border-collapse:collapse;width:100%;margin:.5rem 0}th,td{border:1px solid #999;padding:.35rem .5rem;text-align:left;vertical-align:top}.mini-sq{width:auto}.mini-sq td,.mini-sq th{width:4rem;text-align:center}.refl-text{white-space:pre-wrap;border:1px solid #999;padding:.5rem}.sr-only{position:absolute;left:-9999px}</style></head><body>'+recordHTML()+'<p><button onclick="window.print()">Print or save as PDF</button></p></body></html>';
  try {
    var blob = new Blob([doc], {type:"text/html"}), a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "genetics-in-practice-record"+(state.name?"-"+state.name.replace(/[^A-Za-z0-9]+/g,"-"):"")+".html";
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    announce("Your record was downloaded.");
  } catch(x){ announce("Download is not available here. Try Open in a new tab."); }
}
window.addEventListener("beforeprint", buildRecord);
